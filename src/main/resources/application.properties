spring.application.name=fished
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/fishpond?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.task.scheduling.pool.size=3


spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8


server.servlet.session.timeout=2h
server.servlet.session.cookie.name=AQUAGUARD_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


app.auth.default-username=admin
app.auth.default-password=123456

# 是否开放注册（演示环境默认开启；公开部署可设为 false）
app.auth.registration-enabled=true


app.agent.enabled=true
app.agent.provider=deepseek
app.agent.base-url=https://api.deepseek.com
app.agent.api-key=${DEEPSEEK_API_KEY:}
app.agent.model=deepseek-chat
app.agent.max-tool-rounds=6
app.agent.max-tools-per-round=4
app.agent.max-history-messages=30
app.agent.request-timeout-seconds=120
app.agent.pending-action-ttl-seconds=300
app.agent.max-tokens=1200
app.agent.temperature=0.3
app.agent.stream=true
